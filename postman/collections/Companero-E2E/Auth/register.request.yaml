$kind: http-request
name: register
order: 2000
method: POST
url: '{{baseUrl}}/auth/register'
description: 'Auth: noauth (public registration endpoint).'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "",
      "password": "",
      "displayName": ""
    }

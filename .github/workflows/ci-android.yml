name: ci-android

# Android validation. No deployment and no store publishing.
# Proves the app compiles, the JUnit 5 suites genuinely execute, lint is
# clean of errors, and both a debug and a minified test-release APK build.
# The test-release uses the debug key and is NOT a production distribution.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android compile, test, lint and package
    # Pinned, not ubuntu-latest: the floating label migrates to Ubuntu 26 on
    # 2026-10-19, and a foundation PR should not silently change its own
    # toolchain underneath a green build.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
      COMPANERO_FIREBASE_APP_ID: ${{ vars.COMPANERO_FIREBASE_APP_ID }}
      COMPANERO_FIREBASE_PROJECT_ID: ${{ vars.COMPANERO_FIREBASE_PROJECT_ID }}
      COMPANERO_FIREBASE_SENDER_ID: ${{ vars.COMPANERO_FIREBASE_SENDER_ID }}
      COMPANERO_FIREBASE_API_KEY: ${{ vars.COMPANERO_FIREBASE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # BUG-004: the whitespace check inspects a commit range, which
          # needs history. A shallow clone makes the range unresolvable and
          # the check would have to silently skip itself.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # BUG-004: `git diff --check` with no range inspects only the working
      # tree, which on a CI checkout is always clean. It passed
      # unconditionally and could never catch a committed defect.
      - name: Whitespace errors in committed changes
        run: bash infrastructure/scripts/check-whitespace.sh

      - name: Verify evidence exporter regression tests
        run: python3 -m unittest discover -s infrastructure/scripts/tests -p test_export_v10_evidence.py

      - name: Validate local Firebase configuration helper
        shell: pwsh
        run: ./infrastructure/scripts/tests/Test-AcademicFirebaseConfiguration.ps1

      - name: Compile Android sources
        run: ./gradlew :apps:android:app:compileAcademicDebugKotlin :apps:android:app:compileManagementDebugKotlin --console=plain

      # BUG-003: AGP defaults to the JUnit 4 runner, which compiles a JUnit 5
      # suite and then reports zero tests without failing. useJUnitPlatform()
      # is set in every Android module; this step proves it took effect.
      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest :apps:android:app:testAcademicDebugUnitTest :apps:android:app:testManagementDebugUnitTest --console=plain

      - name: Verify Android tests actually executed
        run: |
          set -euo pipefail
          reports=$(find apps -path '*/build/test-results/*' -name 'TEST-*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No Android JUnit reports. The tests did not run. See BUG-003."
            exit 1
          fi
          # awk, not bc: bc is not guaranteed to be installed on the runner
          # image, and under `set -e` a missing binary fails the step for a
          # reason unrelated to the tests.
          read -r total failures errors <<< "$(find apps -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 \
            | xargs -0 -r grep -hoE '(tests|failures|errors)="[0-9]+"' \
            | awk -F'"' '{ v=$2+0; if ($1 ~ /^tests/) t+=v; else if ($1 ~ /^failures/) f+=v; else e+=v }
                       END { printf "%d %d %d", t+0, f+0, e+0 }')"
          echo "android suites=$reports tests=$total failures=$failures errors=$errors"
          if [ "$total" -lt 1 ]; then
            echo "::error::Zero Android tests executed. useJUnitPlatform() is missing."
            exit 1
          fi
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "::error::Failing Android tests present."
            exit 1
          fi

      - name: Lint
        run: ./gradlew lint --console=plain

      # Warnings are reported, not failed. Errors must be zero.
      - name: Lint has no errors
        run: |
          set -euo pipefail
          reports=$(find . -name 'lint-results*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No lint reports produced."
            exit 1
          fi
          # grep exits 1 when there are zero matches. Under pipefail that made
          # a perfectly clean lint report fail before the numeric comparison.
          # awk always exits successfully and returns an explicit zero.
          errors=$(find . -name 'lint-results*.xml' -print0 \
            | xargs -0 -r awk 'BEGIN { c=0 } /severity="Error"/ { c++ } END { print c+0 }')
          warnings=$(find . -name 'lint-results*.xml' -print0 \
            | xargs -0 -r awk 'BEGIN { c=0 } /severity="Warning"/ { c++ } END { print c+0 }')
          echo "lint errors=$errors warnings=$warnings"
          if [ "$errors" -ne 0 ]; then
            echo "::error::Lint errors present."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew :apps:android:app:assembleAcademicDebug :apps:android:app:assembleManagementDebug --console=plain

      - name: Debug APK exists
        run: |
          set -euo pipefail
          for flavor in academic management; do
            apk="apps/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -f "$apk" || { echo "::error::$apk not found"; exit 1; }
            echo "$flavor debug apk: $(du -h "$apk" | cut -f1)"
          done

      - name: Build minified release APK
        run: ./gradlew :apps:android:app:assembleAcademicRelease :apps:android:app:assembleManagementRelease --console=plain

      # Release is minified and resource-shrunk. The current build is signed
      # with the debug key for internal testing, not production distribution.
      # R8 runtime correctness still requires instrumentation/smoke testing.
      - name: Release APK exists and is minified
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root" || { echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT unavailable"; exit 1; }
          signer="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$signer" && test -x "$aapt" || exit 1
          for flavor in academic management; do
            release="apps/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            debug="apps/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -f "$release" && test -f "$debug" || { echo "::error::Missing $flavor APK"; exit 1; }
            r=$(stat -c%s "$release"); d=$(stat -c%s "$debug")
            if [ "$r" -ge "$d" ]; then
              echo "::error::$flavor release not minified"; exit 1
            fi
            "$signer" verify --verbose --print-certs "$release"
            expected="org.companerodeescuela"
            if [ "$flavor" = management ]; then expected="org.companerodeescuela.gestion"; fi
            "$aapt" dump badging "$release" | grep -F "package: name='$expected'" > /dev/null || {
              echo "::error::$flavor release has unexpected package ID"; exit 1;
            }
            echo "$flavor: debug=$d bytes, release=$r bytes, package=$expected"
          done

      - name: No secrets committed
        run: bash infrastructure/scripts/secret-scan.sh

      - name: Stage traceable RC APKs
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          out="build/rc-artifacts"
          mkdir -p "$out"
          for flavor in academic management; do
            cp "apps/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" \
              "$out/companero-$flavor-debug-$short_sha.apk"
            cp "apps/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" \
              "$out/companero-$flavor-test-release-debug-signed-$short_sha.apk"
          done
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "release_signing=debug_key_internal_testing_only"
            echo "production_distribution_ready=false"
            if [ -n "$COMPANERO_FIREBASE_APP_ID" ]; then echo "firebase_configured=true"; else echo "firebase_configured=false_diagnostic_only"; fi
          } > "$out/BUILD_PROVENANCE.txt"
          ls -lh "$out"

      # Artifact storage is useful for convenience, but quota exhaustion is
      # external to source correctness. Packaging is already proven above by
      # explicit file and size checks.
      - name: Upload reports and APKs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-artifacts
          path: |
            build/rc-artifacts/**
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/reports/lint-results*.html
            **/build/test-results/**/*.xml
          retention-days: 7

  instrumentation:
    name: Android ${{ matrix.flavor }} instrumentation API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 35]
        flavor: [academic, management]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Prepare native emulator signal diagnostics
        run: sudo apt-get install -y strace gdb

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Build instrumentation APKs before starting the emulator
        run: |
          case "${{ matrix.flavor }}" in
            academic) variant=Academic ;;
            management) variant=Management ;;
            *) exit 1 ;;
          esac
          ./gradlew ":apps:android:app:assemble${variant}Debug" ":apps:android:app:assemble${variant}DebugAndroidTest" --max-workers=2 --no-daemon --console=plain

      - name: Run Instrumentation Tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # Stable 36.4.9: make the native emulator runtime reproducible.
          emulator-build: "14788078"
          # API 35 Google APIs plus Compose instrumentation was exhausting
          # Binder-side service headroom at 2 GiB in Management runs.
          ram-size: 3072M
          # Supported software GLES/Vulkan path through ANGLE; retain KVM.
          # Runs with the legacy indirect mode ended in native QEMU SIGSEGV on API35.
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -show-kernel
          # App contains the smoke tests. Root task also launches empty library
          # suites concurrently against the same emulator and can stall ADB.
          script: bash infrastructure/scripts/run-v10-instrumentation.sh ${{ matrix.flavor }}

      - name: Verify instrumentation tests actually executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('apps/android/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml')
          suites = [ET.parse(path).getroot() for path in reports]
          tests = sum(int(suite.get('tests', 0)) for suite in suites)
          failures = sum(int(suite.get('failures', 0)) + int(suite.get('errors', 0)) for suite in suites)
          skipped = sum(int(suite.get('skipped', 0)) for suite in suites)
          flavor = '${{ matrix.flavor }}'
          minimum = 40 if flavor == 'academic' else 19
          print(f'{flavor} instrumentation tests={tests} failures={failures} skipped={skipped}')
          if tests < minimum or failures != 0 or skipped != 0:
              raise SystemExit(f'{flavor} instrumentation requires {minimum}+ executed tests with zero failures or skips')
          cases = [case for suite in suites for case in suite.findall('testcase')]
          def require_distinct(cls, count):
              matching = [case for case in cases if case.get('classname') == cls]
              assert len(matching) == count and len({case.get('name') for case in matching}) == count, (
                  f'{flavor} expected {count} distinct tests in {cls}'
              )
          require_distinct('org.companerodeescuela.V12AdministrationUiTest', 5)
          require_distinct('org.companerodeescuela.AppDistributionSmokeTest', 2)
          require_distinct('org.companerodeescuela.InstitutionalClassesUiTest', 4)
          require_distinct('org.companerodeescuela.CoordinationAttendanceIndicatorsUiTest', 3)
          require_distinct('org.companerodeescuela.NotificationConsentUiTest', 3)
          require_distinct('org.companerodeescuela.AttendanceTruthUiTest', 6)
          if flavor == 'management':
              require_distinct('org.companerodeescuela.DistributionLoginUiTest', 2)
              require_distinct('org.companerodeescuela.V14RoleNavigationUiTest', 7)
          PY

      - name: Upload Android UI evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v10-login-ui-evidence-${{ matrix.flavor }}-api-${{ matrix.api-level }}
          path: |
            build/v10-device-evidence/**
            build/v19-institutional-evidence/**
            build/v10-runner-diagnostics/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          retention-days: 7

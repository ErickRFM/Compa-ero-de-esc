name: qa-registration-android

# QA only, debug-signed. Never publish as a production installation.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qa-registration-android.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-registration-android.yml'
      - 'apps/android/**'
      - 'shared/**'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  qa-registration-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
      COMPANERO_API_BASE_URL: https://companero-qa-univ-v25.onrender.com/
      COMPANERO_RELEASE_API_BASE_URL: https://companero-qa-univ-v25.onrender.com/
      COMPANERO_SIGNING_MODE: internal
      COMPANERO_QA_ISOLATED_APP: 'true'
      COMPANERO_FIREBASE_APP_ID: ''
      COMPANERO_FIREBASE_PROJECT_ID: ''
      COMPANERO_FIREBASE_SENDER_ID: ''
      COMPANERO_FIREBASE_API_KEY: ''
      COMPANERO_MANAGEMENT_FIREBASE_APP_ID: ''
      COMPANERO_MANAGEMENT_FIREBASE_PROJECT_ID: ''
      COMPANERO_MANAGEMENT_FIREBASE_SENDER_ID: ''
      COMPANERO_MANAGEMENT_FIREBASE_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build QA-only academic debug APK
        run: ./gradlew :apps:android:app:assembleAcademicDebug --no-daemon --console=plain
      - name: Verify package, endpoint and debug-only provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/academic/debug/app-academic-debug.apk
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -x "$aapt" && test -x "$apksigner"
          "$aapt" dump badging "$apk" | grep -F "package: name='org.companerodeescuela.qa'" >/dev/null
          "$apksigner" verify --verbose "$apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          path = 'apps/android/app/build/outputs/apk/academic/debug/app-academic-debug.apk'
          with ZipFile(path) as apk:
              dex = [x for x in apk.namelist() if x.startswith('classes') and x.endswith('.dex')]
              assert dex, 'No DEX files found in QA APK'
              assert any(b'companero-qa-univ-v25.onrender.com' in apk.read(x) for x in dex), 'QA API URL not found in APK'
              assert not any(b'compa-ero-de-esc.onrender.com' in apk.read(x) for x in dex), 'Production API URL present in QA APK'
          PY
          mkdir -p build/qa-registration
          cp "$apk" build/qa-registration/companero-academic-qa-registration-debug.apk
          sha256sum build/qa-registration/*.apk > build/qa-registration/SHA256SUMS.txt
          {
            echo "commit=$GITHUB_SHA"
            echo 'distribution=academic-qa-registration'
            echo 'package_id=org.companerodeescuela.qa'
            echo 'api_base_url=https://companero-qa-univ-v25.onrender.com/'
            echo 'signing=android-debug-key'
            echo 'release_distribution=false'
            echo 'firebase_disabled=true'
          } > build/qa-registration/PROVENANCE.txt
      - name: Upload QA debug APK with provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companero-qa-registration-debug
          path: build/qa-registration/
          retention-days: 7
          if-no-files-found: error

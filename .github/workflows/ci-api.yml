name: ci-api

# Backend validation for the Ktor service and the shared Kotlin modules.
# No deployment: this workflow only proves the backend still builds and tests.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend compile, test and smoke
    # Pinned, not ubuntu-latest: the floating label migrates to Ubuntu 26 on
    # 2026-10-19, and a foundation PR should not silently change its own
    # toolchain underneath a green build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Disposable local service: lifecycle concurrency is tested against real MongoDB.
    services:
      mongo:
        image: mongo:7.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
      V12_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # BUG-004: the whitespace check inspects a commit range, which
          # needs history. A shallow clone makes the range unresolvable and
          # the check would have to silently skip itself.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Wrapper is committed and intact
        run: |
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -q 'distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # BUG-004: `git diff --check` with no range inspects only the working
      # tree, which on a CI checkout is always clean. It therefore passed
      # unconditionally and could never fail for a defect committed in the PR.
      # The committed range is what actually needs checking.
      - name: Whitespace errors in committed changes
        run: bash infrastructure/scripts/check-whitespace.sh

      - name: Kotlin style check
        run: ./gradlew ktlintCheck --console=plain

      - name: Compile backend and shared
        run: ./gradlew :services:api:compileKotlin :shared:contracts:compileKotlin :shared:models:compileKotlin :shared:validation:compileKotlin --console=plain

      - name: Run backend and shared tests
        run: ./gradlew :services:api:test :shared:contracts:test :shared:validation:test --console=plain

      # BUG-003: a suite can compile and never run while the build stays green.
      # The exit code is not evidence, so the count is checked explicitly.
      - name: Verify tests actually executed
        run: |
          set -euo pipefail
          # Scoped to the backend and shared modules on purpose. An unscoped
          # `find .` would silently start counting Android reports too if a
          # future change ever ran both in one job, and the number would stop
          # meaning what the summary claims it means.
          reports=$(find services/api shared -path '*/test-results/*' -name 'TEST-*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No JUnit XML reports found. The tests did not run."
            exit 1
          fi
          # awk, not bc: bc is not guaranteed to be installed on the runner
          # image, and under `set -e` a missing binary fails the step for a
          # reason unrelated to the tests.
          read -r total failures errors <<< "$(find services/api shared -path '*/test-results/*' -name 'TEST-*.xml' -print0 \
            | xargs -0 -r grep -hoE '(tests|failures|errors)="[0-9]+"' \
            | awk -F'"' '{ v=$2+0; if ($1 ~ /^tests/) t+=v; else if ($1 ~ /^failures/) f+=v; else e+=v }
                       END { printf "%d %d %d", t+0, f+0, e+0 }')"
          echo "backend suites=$reports tests=$total failures=$failures errors=$errors"
          if [ "$total" -lt 1 ]; then
            echo "::error::Zero tests executed. See BUG-003."
            exit 1
          fi
          if [ "$((failures + errors))" -ne 0 ]; then
            echo "::error::Failing tests present."
            exit 1
          fi

      - name: Require institutional HTTP authorization suites without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, count in [('SiiiAcademicRoutesTest', 5), ('SiiiHttpAcademicAuthorityTest', 1), ('SiiiAttendanceTest', 1)]:
              path = Path(f'services/api/build/test-results/test/TEST-org.companerodeescuela.api.academic.{name}.xml')
              suite = ET.parse(path).getroot()
              assert int(suite.get('tests', '0')) == count, f'{name}: expected {count} executed tests'
              assert all(int(suite.get(k, '0')) == 0 for k in ('skipped', 'failures', 'errors')), name
              print(f'{name}: {count} passed, zero skipped')
          PY

      - name: Verify real Mongo lifecycle integration executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = (("auth", "MongoAccountLifecycleIntegrationTest"), ("auth", "MongoEmailVerificationIntegrationTest"), ("security", "MongoMfaIntegrationTest"), ("auth", "MongoStaffApplicationsIntegrationTest"), ("tutoring", "MongoTutorAssignmentIntegrationTest"), ("academic.groups", "MongoAcademicGroupScopeIntegrationTest"), ("classroom", "MongoClassroomScopeIntegrationTest"), ("academic", "MongoScheduleScopeIntegrationTest"), ("presence", "MongoSchoolQrScopeIntegrationTest"), ("events", "MongoAcademicEventScopeIntegrationTest"), ("presence", "MongoSchoolPresenceScopeIntegrationTest"), ("tutoring", "MongoTutorCaseScopeIntegrationTest"), ("attendance", "MongoAttendanceSourceIntegrationTest"))
          executed = 0
          for package, name in suites + (("representatives", "MongoGroupRepresentativeConcurrencyTest"), ("devices", "MongoDeviceTokenRegistryIntegrationTest"), ("devices", "MongoPushOutboxIntegrationTest")):
              report = Path(f"services/api/build/test-results/test/TEST-org.companerodeescuela.api.{package}.{name}.xml")
              suite = ET.parse(report).getroot()
              minimum = 2 if name == "MongoDeviceTokenRegistryIntegrationTest" else 1 if name == "MongoGroupRepresentativeConcurrencyTest" else 3
              count = int(suite.get("tests", "0"))
              assert count >= minimum, f"Real Mongo tests missing: {name}, got {count}, required {minimum}"
              assert all(int(suite.get(key, "0")) == 0 for key in ("skipped", "failures", "errors")), f"Real Mongo tests did not all pass: {name}"
              executed += count
          print(f"Real Mongo integration: {executed} executed, 0 skipped, 0 failures")
          PY

      - name: Assemble runnable service
        run: ./gradlew :services:api:installDist --console=plain

      # /ready returning 503 with no database is the documented, correct
      # behaviour. Asserting 200 here would encode the bug, not the intent.
      - name: Smoke test
        run: |
          set -euo pipefail
          APP_ENV=local \
          API_HOST=127.0.0.1 \
          API_PORT=8080 \
          MONGODB_DATABASE=companero_ci \
          ./services/api/build/install/api/bin/api &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- GET /health ---"
          health=$(curl -fsS -w '\n%{http_code}' http://127.0.0.1:8080/health)
          echo "$health"
          [ "$(echo "$health" | tail -n1)" = "200" ] || { echo "::error::/health must be 200"; exit 1; }
          echo "$health" | head -n1 | grep -q '"status":"up"' || { echo "::error::/health must report up"; exit 1; }

          echo "--- GET /ready (503 is expected without a database) ---"
          ready=$(curl -sS -w '\n%{http_code}' http://127.0.0.1:8080/ready)
          echo "$ready"
          [ "$(echo "$ready" | tail -n1)" = "503" ] || { echo "::error::/ready must be 503 with no database"; exit 1; }

          echo "--- GET /version ---"
          version=$(curl -fsS -w '\n%{http_code}' http://127.0.0.1:8080/version)
          echo "$version"
          [ "$(echo "$version" | tail -n1)" = "200" ] || { echo "::error::/version must be 200"; exit 1; }

          echo "--- no configuration leak ---"
          for path in health ready version; do
            body=$(curl -sS "http://127.0.0.1:8080/$path")
            case "$body" in
              *mongodb://*|*"hunter2"*) echo "::error::$path leaked configuration"; exit 1 ;;
            esac
          done

      # The inline version of this step only looked for .env and a few key
      # extensions. The script classifies every hit, so a deliberate canary in a
      # test is not confused with a real credential, and an unrecognised host
      # fails instead of being assumed harmless.
      - name: No secrets committed
        run: bash infrastructure/scripts/secret-scan.sh

      # Proves the secret scan can still fail. A control that has only ever
      # printed PASS is not a control.
      - name: Secret scan self-test
        run: bash infrastructure/scripts/secret-scan-test.sh

      # Reports are diagnostic evidence, not a correctness gate. GitHub can
      # reject uploads when the repository/account artifact quota is full;
      # that external storage condition must not turn a fully green build,
      # tests, smoke checks and secret scan into a failed CI result.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 7

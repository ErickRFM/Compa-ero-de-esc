name: temporary-v16-home-format-review
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-v16-home-format-review.yml'
permissions:
  contents: read
jobs:
  formatter-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/v16-home-dashboard-status-accessibility-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Autoformat changed module sources in ephemeral checkout
        run: ./gradlew :apps:android:feature:home:ktlintFormat :apps:android:core:designsystem:ktlintFormat :apps:android:core:navigation:ktlintFormat --console=plain || echo 'Non-autocorrectable style remains in other module files; review output'
      - name: Show formatter output for only affected source files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            apps/android/feature/home/src/main/kotlin/org/companerodeescuela/feature/home/HomeScreen.kt \
            apps/android/feature/home/src/main/kotlin/org/companerodeescuela/feature/home/HomeViewModel.kt \
            apps/android/feature/home/src/main/kotlin/org/companerodeescuela/feature/coordinator/CoordinatorHomeScreen.kt \
            apps/android/feature/home/src/test/kotlin/org/companerodeescuela/feature/home/TodayScheduleTest.kt \
            apps/android/core/designsystem/src/main/kotlin/org/companerodeescuela/core/designsystem/v8/V8StudentDashboard.kt \
            apps/android/core/navigation/src/main/kotlin/org/companerodeescuela/core/navigation/CompaneroBottomBar.kt; do
            echo "BEGIN_HOME_FORMAT:${path}"
            base64 -w 0 "${path}"
            echo
            echo "END_HOME_FORMAT:${path}"
          done

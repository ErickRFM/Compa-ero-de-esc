[versions]
# Build tooling
androidGradlePlugin = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"

# Android SDK levels
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# AndroidX
androidxCore = "1.17.0"
androidxActivity = "1.10.1"
androidxLifecycle = "2.9.4"
androidxNavigation = "2.9.6"
composeBom = "2026.01.01"
androidxDataStore = "1.1.7"
androidxRoom = "2.8.5"
androidxWork = "2.11.0"
androidxHiltNavigationCompose = "1.3.0"

# DI
hilt = "2.57.2"

# Kotlin ecosystem
coroutines = "1.10.2"
serializationJson = "1.9.0"

# Backend
ktor = "3.3.3"
mongodbDriver = "5.13.0"
logback = "1.5.18"

# Testing
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"
turbine = "1.2.1"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# --- Compose (versions from BOM) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Staged for the tablet layouts, which are a later milestone. Referencing it
# from the app module now would be an unused dependency with no screen to size.
androidx-compose-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# --- AndroidX persistence / background ---
# Staged, not in use. core:datastore, core:database and core:security do not
# exist yet, and ADR-001 records what triggers each one. The version pins live
# here so that creating a module is an include line plus a dependency, not a
# version negotiation.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDataStore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }

# --- Hilt ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHiltNavigationCompose" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHiltNavigationCompose" }

# --- Kotlin ecosystem ---
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# The -android artifact already depends on -core, so declaring core separately
# would only add a second version constraint to resolve.
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# --- Ktor ---
ktor-bom = { group = "io.ktor", name = "ktor-bom", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages" }
ktor-server-call-logging = { group = "io.ktor", name = "ktor-server-call-logging" }
ktor-server-call-id = { group = "io.ktor", name = "ktor-server-call-id" }
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors" }
ktor-server-default-headers = { group = "io.ktor", name = "ktor-server-default-headers" }
# auth and auth-jwt are staged for the login phase (M1). Referencing them from
# services:api before there is an auth route would be an unused dependency.
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth" }
ktor-server-auth-jwt = { group = "io.ktor", name = "ktor-server-auth-jwt" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json" }

# --- Ktor client (Android) ---
ktor-client-core = { group = "io.ktor", name = "ktor-client-core" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock" }

# --- MongoDB ---
# Only the coroutine driver. The blocking sync driver is deliberately absent:
# it cannot be used from a coroutine without blocking a thread, and having it
# available would make that mistake easy to write later.
mongodb-driver-kotlin-coroutine = { group = "org.mongodb", name = "mongodb-driver-kotlin-coroutine", version.ref = "mongodbDriver" }

# --- Logging ---
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# --- Testing ---
# junit-jupiter is the aggregate: it already contains junit-jupiter-api,
# junit-jupiter-params and the engine, so the sub-artifacts are not listed
# separately. Declaring them again would pin one version in two places.
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

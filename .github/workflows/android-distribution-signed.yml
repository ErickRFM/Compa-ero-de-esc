name: android-distribution-signed

# Manually requested only. The ordinary Android CI is debug-signed internal QA.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Positive monotonically increasing Android versionCode"
        required: true
        type: string
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  distribution:
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPANERO_SIGNING_MODE: distribution
      COMPANERO_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/companero-distribution.jks
      COMPANERO_RELEASE_STORE_PASSWORD: ${{ secrets.COMPANERO_RELEASE_STORE_PASSWORD }}
      COMPANERO_RELEASE_KEY_ALIAS: ${{ secrets.COMPANERO_RELEASE_KEY_ALIAS }}
      COMPANERO_RELEASE_KEY_PASSWORD: ${{ secrets.COMPANERO_RELEASE_KEY_PASSWORD }}
      COMPANERO_VERSION_CODE: ${{ inputs.version_code }}
      COMPANERO_VERSION_NAME: ${{ inputs.version_name }}
      COMPANERO_RELEASE_API_BASE_URL: ${{ vars.COMPANERO_RELEASE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore securely
        env:
          KEYSTORE_B64: ${{ secrets.COMPANERO_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Release keystore secret missing"; exit 1; }
          test -n "$COMPANERO_RELEASE_STORE_PASSWORD" || exit 1
          test -n "$COMPANERO_RELEASE_KEY_ALIAS" || exit 1
          test -n "$COMPANERO_RELEASE_KEY_PASSWORD" || exit 1
          test -n "$COMPANERO_RELEASE_API_BASE_URL" || {
            echo "::error::Explicit production HTTPS API URL missing"; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$COMPANERO_RELEASE_KEYSTORE_PATH"
          test -s "$COMPANERO_RELEASE_KEYSTORE_PATH"
      - name: Build signed production and comparison debug APK
        run: ./gradlew :apps:android:app:assembleAcademicDebug :apps:android:app:assembleAcademicRelease :apps:android:app:assembleManagementDebug :apps:android:app:assembleManagementRelease --console=plain
      - name: Verify release signing identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.COMPANERO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          signer="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$signer"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt"
          fingerprint() {
            "$signer" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]'
          }
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$expected" || { echo "::error::Pinned release certificate missing"; exit 1; }
          mkdir -p dist/distribution
          for flavor in academic management; do
            release="apps/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            debug="apps/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -f "$release" && test -f "$debug" || { echo "::error::Missing $flavor APK"; exit 1; }
            "$signer" verify --verbose --print-certs "$release"
            "$signer" verify --verbose --print-certs "$debug"
            actual="$(fingerprint "$release")"
            debug_cert="$(fingerprint "$debug")"
            test -n "$actual" && test "$actual" = "$expected" && test "$actual" != "$debug_cert" || {
              echo "::error::$flavor release signing identity rejected"; exit 1;
            }
            expected_package=org.companerodeescuela
            if [ "$flavor" = management ]; then expected_package=org.companerodeescuela.gestion; fi
            "$aapt" dump badging "$release" | grep -F "package: name='$expected_package'" >/dev/null || {
              echo "::error::$flavor release package ID mismatch"; exit 1;
            }
            cp "$release" "dist/distribution/companero-$flavor-v${COMPANERO_VERSION_NAME}-signed.apk"
          done
          {
            echo "sha=$GITHUB_SHA"
            echo "version_code=$COMPANERO_VERSION_CODE"
            echo "version_name=$COMPANERO_VERSION_NAME"
            echo "academic_package_id=org.companerodeescuela"
            echo "management_package_id=org.companerodeescuela.gestion"
            echo "certificate_sha256=$expected"
            echo "signing_mode=production_distribution"
          } > dist/distribution/PROVENANCE.txt
      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: companero-dual-production-signed-${{ github.run_number }}
          path: dist/distribution/
          retention-days: 30
          if-no-files-found: error
      - name: Remove private keystore
        if: always()
        shell: bash
        run: rm -f "$COMPANERO_RELEASE_KEYSTORE_PATH"
